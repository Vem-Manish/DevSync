<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevSync — Collaborative Engineering Suite</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            cinzel: ['"Cinzel"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-[#c29b48]/20 selection:text-[#c29b48]">

  <!-- Global App Header -->
  <header class="h-16 border-b border-[var(--border-subtle)] bg-[var(--bg-surface)]/85 backdrop-blur-md px-8 flex items-center justify-between sticky top-0 z-50 shadow-[var(--shadow-sm)] transition-colors">
    <div class="flex items-center gap-4">
      <div id="btn-home-logo" class="flex items-center gap-3.5 cursor-pointer">
        <div class="h-10 w-10 rounded-xl !bg-white border border-white/20 shadow-md flex items-center justify-center overflow-hidden p-1 shrink-0">
          <img src="assets/logo.png" alt="DevSync Logo" class="w-full h-full object-contain scale-[1.3]">
        </div>
        <span class="font-serif text-2xl font-bold tracking-tight text-[var(--royal-navy)]">DevSync</span>
      </div>

      <!-- Breadcrumb indicator -->
      <div id="workspace-breadcrumb" class="hidden items-center gap-2 text-xs font-mono border-l border-[var(--border-subtle)] pl-4">
        <button id="btn-back-projects" class="text-[var(--text-tertiary)] hover:text-[var(--royal-gold)] transition-colors">Projects</button>
        <span class="text-[var(--text-tertiary)]">/</span>
        <span id="breadcrumb-project-name" class="font-bold text-[var(--text-main)]"></span>
      </div>
    </div>

    <!-- Right Header Controls -->
    <div class="flex items-center gap-3">
      <button id="theme-toggle" class="p-2 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-badge)] text-[var(--text-secondary)] hover:text-[var(--royal-gold)] hover:border-[var(--border-gold)] transition-all cursor-pointer" title="Toggle Light / Dark mode">
        <svg id="theme-icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg id="theme-icon-moon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>

      <div class="flex items-center gap-3" id="user-session-bar">
        <button id="btn-login" class="ds-btn ds-btn-primary">
          Sign in with GitHub
        </button>
      </div>
    </div>
  </header>

  <!-- Workspace Shell -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar Navigation (Active only when a workspace is open) -->
    <aside id="app-sidebar" class="w-64 border-r border-[var(--border-subtle)] bg-[var(--bg-sidebar)] hidden flex-col justify-between p-4 select-none transition-colors">
      <div>
        <p class="text-[11px] font-cinzel font-semibold tracking-wider text-[var(--text-tertiary)] px-3 uppercase mb-2.5">Workspace Suites</p>
        <nav class="space-y-1.5" id="nav-tabs">
          <button data-tab="team" class="nav-item">
            <svg class="w-4 h-4 text-[var(--royal-gold)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            Team & Invites
          </button>
          <button data-tab="mission" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Mission & Dropzone
          </button>
          <button data-tab="editor" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
            Studio Code Editor
          </button>
          <button data-tab="conflict" class="nav-item">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
            PR & Conflict Desk
          </button>
        </nav>
      </div>

      <!-- Active Status Box -->
      <div class="p-3.5 rounded-xl border border-[var(--border-gold)] bg-[var(--bg-surface)] shadow-[var(--shadow-sm)] text-xs transition-colors">
        <div class="flex items-center justify-between">
          <span class="font-cinzel text-[10px] tracking-wider text-[var(--royal-gold)] font-semibold uppercase">Active Context</span>
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
        </div>
        <p class="font-mono text-[var(--royal-navy)] font-semibold mt-1 truncate" id="current-repo-label"></p>
        <p class="font-mono text-[10px] text-[var(--text-tertiary)] mt-0.5" id="current-role-label"></p>
      </div>
    </aside>

    <!-- Main Module Viewport -->
    <main class="flex-1 overflow-y-auto p-10 bg-[var(--bg-primary)] transition-colors" id="module-container">
      <!-- Dynamically injected views -->
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
